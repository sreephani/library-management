spring.application.name=library-management

#mySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/library?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=1$godricgriffendor
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# Hibernate Configuration (controls how Hibernate
# automatically manages your database schema at application startup and shutdown)
# maps Java entity classes directly to database tables, deciding whether
# to create, update, validate, or leave the database structure alone
spring.jpa.hibernate.ddl-auto=create

# Show SQL generated by Hibernate
spring.jpa.show-sql=true

# Format SQL output
spring.jpa.properties.hibernate.format_sql=true

# Server Port
server.port=8080
